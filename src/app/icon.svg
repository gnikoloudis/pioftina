<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pioftinaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#1d4ed8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#pioftinaGrad)" filter="url(#glow)"/>

  <!-- Subtle inner border accent ring -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="none" stroke="#93c5fd" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- Subtle crosshair grid overlay matching header logo -->
  <line x1="2" y1="32" x2="62" y2="32" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
  <line x1="32" y1="2" x2="32" y2="62" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Greek letter π (pi) rendered with fallback font stack -->
  <text 
    x="32" 
    y="39" 
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
    font-size="34" 
    font-weight="900" 
    fill="#ffffff" 
    text-anchor="middle" 
    dominant-baseline="central"
    letter-spacing="-0.5px"
  >π</text>
</svg>
